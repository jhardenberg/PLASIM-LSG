name: PlaSim tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  tests:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run tests')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install compilers, MPI, CDO, X11 headers, and NetCDF-Fortran
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gfortran libopenmpi-dev openmpi-bin cdo libx11-dev libnetcdff-dev netcdf-bin
          cdo --version
          mpif90 --version
          mpiexec --version
          nf-config --version
      - name: Run tests
        run: python3 tests/run_tests.py -v -j 4
